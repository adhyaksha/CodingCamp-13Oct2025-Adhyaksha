<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-list = Adhyaksha</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="satubadan">
    <!-- bagian header -->
     <header>
        <h1>To-Do list</h1>
     </header>


     <!-- main atau content -->
      <main>

        <!-- section pertama -->
        <section class="konten1">
            <input class="input1" type="text" id="todo-input" placeholder="masukan catatan">
            <input class="input2" type="date" id="todo-date" placeholder="masukan tanggal">
            <button class="buatId" onclick="addTask()">add</button>
        </section>
        
        <!-- section kedua -->
        <section class="konten2">

            <button id="filter-btn" onclick="filterTasks()">filter</button>
            <button onclick="deleteAllTasks()">Delate All list</button>

        </section>

        <!-- section ketiga -->
        <section class="konten3">
            <h1>isi list nya</h1>
            <ul id="task-list">
                <li>gak ada list apapun</li>
            </ul>
        </section>
      </main>

      <!-- footer -->
       <footer>
        <p>@2025 Adhyaksha To-DO list</p>
       </footer>

       </div>
       <!-- link nyambungin js -->
    <script src="./js/script.js"></script>
</body>
</html>
